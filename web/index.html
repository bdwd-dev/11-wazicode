<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WaziCode — Plateforme Développeur Africaine</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #fff; }
    .container { max-width: 1400px; margin: 0 auto; padding: 0 24px; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid #222; }
    .logo { font-size: 28px; font-weight: 900; color: #00D4AA; letter-spacing: 2px; }
    .nav { display: flex; gap: 24px; }
    .nav a { color: #888; text-decoration: none; font-size: 14px; }
    .nav a:hover, .nav a.active { color: #00D4AA; }
    .hero { padding: 40px 0; }
    .hero h1 { font-size: 32px; margin-bottom: 8px; }
    .hero p { color: #666; font-size: 16px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin: 24px 0; }
    .stat-card { background: #141414; border-radius: 12px; padding: 20px; border: 1px solid #222; }
    .stat-value { font-size: 32px; font-weight: bold; color: #00D4AA; }
    .stat-label { font-size: 12px; color: #666; margin-top: 4px; text-transform: uppercase; }
    .section { margin: 32px 0; }
    .section-title { font-size: 20px; font-weight: 600; margin-bottom: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .card { background: #141414; border-radius: 12px; padding: 20px; border: 1px solid #222; }
    .card:hover { border-color: #00D4AA; }
    .card-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .card-sub { color: #666; font-size: 13px; }
    .btn { background: #00D4AA; color: #000; border: none; padding: 10px 20px; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 600; }
    .btn:hover { opacity: 0.9; }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .badge-active { background: #1a3a1a; color: #4ade80; }
    .badge-free { background: #1a1a3a; color: #818cf8; }
    .badge-pro { background: #3a1a1a; color: #f87171; }
    .badge-business { background: #3a2a1a; color: #fbbf24; }
    .table { width: 100%; border-collapse: collapse; }
    .table th { text-align: left; padding: 12px; color: #666; font-size: 12px; text-transform: uppercase; border-bottom: 1px solid #222; }
    .table td { padding: 12px; border-bottom: 1px solid #1a1a1a; font-size: 14px; }
    .table tr:hover { background: #1a1a1a; }
    .footer { text-align: center; padding: 40px 0; color: #444; font-size: 13px; border-top: 1px solid #222; margin-top: 40px; }
    .sandbox-box { background: #0a1a1a; border: 1px solid #00D4AA; border-radius: 8px; padding: 16px; margin: 12px 0; }
    .sandbox-box pre { color: #00D4AA; font-family: monospace; font-size: 13px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const API = "http://localhost:3011/api";

    function App() {
      const [stats, setStats] = useState({});
      const [sdks, setSdks] = useState([]);
      const [transactions, setTransactions] = useState([]);
      const [users, setUsers] = useState([]);

      useEffect(() => {
        fetch(`${API}/stats`).then(r => r.json()).then(setStats);
        fetch(`${API}/sdks`).then(r => r.json()).then(setSdks);
        fetch(`${API}/transactions`).then(r => r.json()).then(setTransactions);
        fetch(`${API}/users`).then(r => r.json()).then(setUsers);
      }, []);

      return (
        <div>
          <header className="header">
            <div className="logo">💻 WAZICODE</div>
            <nav className="nav">
              <a href="#" className="active">Dashboard</a>
              <a href="#">Sandbox</a>
              <a href="#">SDKs</a>
              <a href="#">API Keys</a>
            </nav>
          </header>

          <div className="container">
            <section className="hero">
              <h1>Plateforme Développeur Africaine</h1>
              <p>Sandbox vérifiée • Mobile Money • SMS • USSD — Open Source</p>
            </section>

            <div className="stats">
              <div className="stat-card">
                <div className="stat-value">{stats.users || 0}</div>
                <div className="stat-label">Développeurs</div>
              </div>
              <div className="stat-card">
                <div className="stat-value">{stats.api_keys || 0}</div>
                <div className="stat-label">Clés API</div>
              </div>
              <div className="stat-card">
                <div className="stat-value">{stats.transactions || 0}</div>
                <div className="stat-label">Transactions</div>
              </div>
              <div className="stat-card">
                <div className="stat-value">{stats.sdks || 0}</div>
                <div className="stat-label">SDKs</div>
              </div>
            </div>

            <section className="section">
              <h2 className="section-title">📦 SDKs Open Source</h2>
              <div className="grid">
                {sdks.map((sdk, i) => (
                  <div key={i} className="card">
                    <div className="card-title">{sdk.name}</div>
                    <div className="card-sub">v{sdk.version} • {sdk.language} • {sdk.downloads?.toLocaleString()} downloads</div>
                    <button className="btn btn-sm" style={{marginTop:8}}>Installer</button>
                  </div>
                ))}
              </div>
            </section>

            <section className="section">
              <h2 className="section-title">🧪 Bac à Sable (Sandbox)</h2>
              <div className="sandbox-box">
                <pre>
{`POST /api/sandbox/mobile-money
{ "phone": "+24206xxxxxxx", "amount": 1000, "provider": "MTN" }

POST /api/sandbox/sms
{ "phone": "+24206xxxxxxx", "message": "Hello" }

POST /api/sandbox/ussd
{ "code": "*123#", "phone": "+24206xxxxxxx" }`}
                </pre>
              </div>
            </section>

            <section className="section">
              <h2 className="section-title">👥 Développeurs</h2>
              <table className="table">
                <thead><tr><th>Nom</th><th>Email</th><th>Plan</th><th>Téléphone</th></tr></thead>
                <tbody>
                  {users.map(u => (
                    <tr key={u.id}>
                      <td>{u.name}</td>
                      <td>{u.email}</td>
                      <td><span className={`badge badge-${u.plan}`}>{u.plan}</span></td>
                      <td>{u.phone}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </section>
          </div>

          <footer className="footer">
            <p>© 2026 WaziCode — Open Source Africa • UmojaStack • PamojaDev</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
